name: NoMore Spam

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  spam-detection:
    if: github.repository == 'Silentely/TG-SignPulse'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Detect and close spam
        # 钉到完整 commit SHA（40-hex），由 .github/dependabot.yml 的
        # github-actions 生态每周自动跟进上游更新
        uses: JohnsonRan/nomore-spam@d29caa66a03c4855849bf7956c2f47b0c3401cd3
        with:
          github-token: ${{ github.token }}
          ai-base-url: ${{ secrets.AI_BASE_URL }}  # 可选：自定义API端点（去除 /chat/completions）
          ai-api-key: ${{ secrets.AI_API_KEY }}  # 可选：自定义API密钥
          ai-model: ${{ secrets.AI_MODEL }}  # 可选：自定义模型名称
          labels: 'bug,enhancement,question'
          analyze-file-changes: 'true'
          max-analysis-depth: 'normal'
          language: 'zh-CN'
          blacklist: ${{ secrets.BLACKLIST }} # 可选：黑名单用户列表
