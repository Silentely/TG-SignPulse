name: Community Plugin PR Branch Guard

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  check-and-retarget:
    name: Check & Retarget Base Branch
    runs-on: ubuntu-latest
    if: github.repository == 'Silentely/TG-SignPulse'
    steps:
      - name: Check if PR modifies community plugins and retarget to dev
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('No pull request found in context payload.');
              return;
            }

            const prNumber = pr.number;
            const baseRef = pr.base ? pr.base.ref : '';

            // 仅当目标分支为 main 时进行处理
            if (baseRef !== 'main') {
              console.log(`PR #${prNumber} base is '${baseRef}' (not 'main'). No action needed.`);
              return;
            }

            console.log(`PR #${prNumber} targets 'main'. Checking modified files...`);

            // 获取该 PR 涉及的所有变更文件
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const hasPluginChanges = files.some(f => f.filename.startsWith('community_plugins/'));

            if (!hasPluginChanges) {
              console.log(`PR #${prNumber} does not modify community_plugins/. Skipping retargeting.`);
              return;
            }

            console.log(`PR #${prNumber} modifies community_plugins/ and targets 'main'. Attempting to retarget to 'dev'...`);

            let retargetSuccess = false;
            try {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                base: 'dev',
              });
              retargetSuccess = true;
              console.log(`Successfully retargeted PR #${prNumber} to 'dev'.`);
            } catch (updateErr) {
              console.error(`Failed to update base branch for PR #${prNumber}:`, updateErr);
            }

            if (retargetSuccess) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: '🔄 **PR 目标分支已自动调整为 `dev`**\n\n检测到本 PR 提交了社区插件且目标分支为 `main`。根据 TG-SignPulse 社区规范，所有插件提交须统一合并至 `dev` 分支，已自动为您将目标分支（base branch）调整为 `dev`。🎉',
                });
              } catch (commentErr) {
                console.error('Failed to post success comment:', commentErr);
              }
            } else {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: '⚠️ **请将 PR 目标分支修改为 `dev`**\n\n检测到您向 `main` 分支提交了社区插件。\n\n根据项目规范，所有社区插件提交必须针对 `dev` 分支（经 CI 自动化门禁测试通过后，由官方流水线统一发布至 `main` 分支）。\n\n由于自动修改分支遇到异常（例如 PR 分支与 `dev` 分支存在代码冲突），请手动在 PR 页面标题右侧点击 **Edit**，将 base 分支由 `main` 切换为 `dev` 并解决冲突，或重新向 `dev` 分支发起 PR。谢谢配合！',
                });
              } catch (commentErr) {
                console.error('Failed to post failure comment:', commentErr);
              }
              core.setFailed('Community plugin PRs must target the "dev" branch, not "main". Please retarget your PR to "dev".');
            }
